<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="title desc">
<title id="title">Civic’s Windsor service radius</title><desc id="desc">Schematic showing a 50-mile straight-line radius around Windsor and selected places within it. North is up.</desc>
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#627e70" stroke-width=".6"/></pattern></defs>
<rect width="520" height="460" fill="#172d28"/><rect width="520" height="460" fill="url(#grid)"/>
<circle cx="260" cy="230" r="190" fill="#547764" fill-opacity=".32" stroke="#e3af82" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="260" cy="230" r="95" fill="none" stroke="#859d8b" stroke-opacity=".5"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#fffaf1">
<circle cx="235" cy="83" r="3" fill="#f1b887"/><text x="241" y="77">Milton Keynes</text>
<circle cx="154" cy="159" r="3" fill="#f1b887"/><text x="160" y="153">Oxford</text>
<circle cx="304" cy="159" r="3" fill="#f1b887"/><text x="310" y="153">St Albans</text>
<circle cx="200" cy="237" r="3" fill="#f1b887"/><text x="206" y="231">Reading</text>
<circle cx="339" cy="223" r="3" fill="#f1b887"/><text x="345" y="217">London</text>
<circle cx="266" cy="294" r="3" fill="#f1b887"/><text x="272" y="288">Guildford</text>
<circle cx="146" cy="340" r="3" fill="#f1b887"/><text x="152" y="334">Winchester</text>
<circle cx="260" cy="230" r="10" fill="none" stroke="#f1b887"/><circle cx="260" cy="230" r="5" fill="#f1b887"/><text x="274" y="249" fill="#ffd3ab" font-size="20" font-weight="bold">Windsor</text><text x="26" y="437" font-size="13">Approximate 50-mile radius</text><text x="472" y="43">↑ N</text></g></svg>
